name: CI

on:
  push:
    branches: [ development, main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint
        run: composer lint
      - name: Unit tests
        run: composer test

  standards:
    name: Coding standards
    runs-on: ubuntu-latest
    # Six findings on development wait on owner decisions; until they are
    # settled this job annotates pull requests without blocking a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: PHPCS
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr
