name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint
        run: composer lint
      - name: Unit tests
        run: composer test

  standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr
      - run: composer install --prefer-dist --no-interaction --no-progress
      # Six findings on main wait on owner decisions. Until they are
      # settled every finding is annotated, but only a new one fails the job.
      - name: PHPCS
        env:
          BASELINE: 6
        run: |
          vendor/bin/phpcs -q --report=checkstyle > "$RUNNER_TEMP/phpcs-report.xml" || true
          cs2pr --graceful-warnings "$RUNNER_TEMP/phpcs-report.xml" || true
          found=$(grep -c '<error ' "$RUNNER_TEMP/phpcs-report.xml" || true)
          echo "PHPCS findings: $found (baseline $BASELINE)"
          test "$found" -le "$BASELINE"
